name: Docker

on:
  workflow_call:

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      # App .env
      # MONGO_URI: ${{ secrets.CONNECTION_STRING }}
      # DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      # DEEPSEEK_API_URL: ${{ secrets.DEEPSEEK_API_URL }}
      # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # OPENAI_API_URI: ${{ secrets.OPENAI_API_URI }}
      # TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

      # # DB .env
      # MONGO_INITDB_ROOT_USERNAME: ${{ secrets.MONGO_INITDB_ROOT_USERNAME }}
      # MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}
      # MONGO_INITDB_DATABASE: ${{ secrets.MONGO_INITDB_DATABASE }}

    steps:
    - uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: sa-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1
      
    - name: Build Docker image
      run: docker build -t ${{ secrets.ECR_REPOSITORY }}:${{ secrets.IMAGE_TAG }} .

    - name: Tag Docker image for ECR
      run: docker tag ${{ secrets.ECR_REPOSITORY }}:${{ secrets.IMAGE_TAG }} ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ secrets.IMAGE_TAG }}

    - name: Push Docker image to ECR
      run: docker push ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ secrets.IMAGE_TAG }}


  # deploy:
